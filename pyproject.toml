[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satprof"
version = "0.6.0"
description = "Автоматическая калибровка спутниковых радиаций, восстановление профилей и интеграция SatDump/WRFDA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SatProf contributors"}]
dependencies = ["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","xarray>=2023.1","PyYAML>=6.0","requests>=2.31","joblib>=1.3","matplotlib>=3.7","fastapi>=0.110","uvicorn[standard]>=0.27","pydantic>=2.6"]

[project.optional-dependencies]
bufr = ["eccodes>=1.6"]
netcdf = ["netCDF4>=1.6"]
orbit = ["sgp4>=2.23"]
satdump = ["rasterio>=1.3", "Pillow>=10", "cbor2>=5.6"]
wis2 = ["paho-mqtt>=2.1"]
all = ["eccodes>=1.6", "netCDF4>=1.6", "sgp4>=2.23", "rasterio>=1.3", "Pillow>=10", "cbor2>=5.6", "paho-mqtt>=2.1"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
satprof = "satprof_calibrator.cli:main"
satprof-web = "satprof_calibrator.web.app:main"
satprof-worker = "satprof_calibrator.worker:main"
satprof-wis2 = "satprof_calibrator.sources.wis2:main"
satprof-monitor = "satprof_calibrator.monitoring:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"satprof_calibrator.web" = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
