name: Проверка SatProf

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установка
        run: pip install --no-build-isolation -e ".[test]"
      - name: Python tests
        run: pytest -q
      - name: Python syntax
        run: python -m compileall -q src
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: node --check src/satprof_calibrator/web/static/app.js
