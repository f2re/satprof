name: Проверка SatProf

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установка
        run: pip install --no-build-isolation -e ".[test,wis2]"
      - name: Python tests
        run: pytest -q
      - name: Python syntax
        run: python -m compileall -q src
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: find src/satprof_calibrator/web/static -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Bash syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Systemd unit syntax
        run: |
          output="$(systemd-analyze verify systemd/*.service systemd/*.timer 2>&1 || true)"
          filtered="$(printf '%s\n' "$output" | grep -v 'Command /opt/satprof/.venv/bin/.* is not executable' || true)"
          if [ -n "$filtered" ]; then
            printf '%s\n' "$filtered"
            exit 1
          fi
